<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday, Name!</title>    <!-- Replace Name -->
<link rel="icon" href="User%20Content/user-img/example.png">   <!-- Replace with file you uploaded to the folder "user-img" -->

<link rel="stylesheet" href="/main.css">
</head>

<body>
<br>
<p>Click card to open</p>

<section id="header">

    <div class="card">

        <!-- CLOSED -->
        <div id="closed">
            <img src="User%20Content/user-img/example.png" alt="Card Front">   <!-- Replace with file you uploaded to the folder -->
        </div>

        <!-- OPEN -->
        <div id="opened">

            <div class="left-panel">
                <img src="User%20Content/user-img/example.png" alt="Card Inside Image">   <!-- Replace with file you uploaded to the folder -->
            </div>

            <div class="right-panel">
                <div class="inner-content">
                    <h1>Dear Name,</h1>   <!-- Replace name with recipients name -->
                    <p>Add message here.</p>   <!-- Replace name with custom message -->
                </div>
            </div>

        </div>

    </div>

</section>

<script src="/main.js"></script>

</body>
</html>
