<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday, Marvin!</title>

<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="main.css">

</head>

<body>
<h1>Click card to open.</h1>
<br>
<h1>Best viewed on desktop.</h1>
<section id="header">

<div class="card">

    <div id="closed">
        <img src="front.png" alt="Card Cover" class="card-front-image">
    </div>

    <div id="opened">
        <div class="left-panel">
            <img src="front.png" alt="Card Cover Copy" class="card-front-image">
        </div>
        <div class="right-panel">
            <div class="inner-content">
                <h1>Dear Marvin,</h1>
                <h3>
Have a wonderfull birthday!
                    <br>
                </h3>
                <p>See you on monday. :)</p>
            </div>
        </div>
    </div>

</div>

</section>

<script src="main.js"></script>

</body>
</html>
