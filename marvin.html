<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday</title>

<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="main.css">

</head>

<body>

<section id="header">

<div class="card">

    <div id="closed">
        <img src="front.png" alt="Card Cover" class="card-front-image">
    </div>

    <div id="opened">
        <div class="left-panel">
            <img src="front.png" alt="Card Cover Copy" class="card-front-image">
        </div>
        <div class="right-panel">
            <div class="inner-content">
                <h1>Happy Birthday</h1>
                <p>
                    Hope this year brings<br>
                    new projects,<br>
                    good memories,<br>
                    and everything you want.
                </p>
            </div>
        </div>
    </div>

</div>

</section>

<script src="main.js"></script>

</body>
</html>
